<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON UNICORN</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- Home Screen -->
        <div id="home-screen" class="screen">
            <h1 class="logo">NEON UNICORN</h1>
            <div class="subtitle">A Multiplayer Dream Run</div>

            <div class="menu-options">
                <button id="btn-create-room" class="btn primary">CREATE ROOM</button>
                <div class="join-section">
                    <input type="text" id="room-code-input" placeholder="ROOM CODE" maxlength="4">
                    <button id="btn-join-room" class="btn secondary">JOIN ROOM</button>
                </div>
                <div id="error-msg" class="error hidden"></div>
            </div>

            <div class="controls-info">
                Desktop: [SPACE/UP] Jump &bull; [SHIFT/X] Dash<br>
                Mobile: Tap Left half to Jump &bull; Tap Right half to Dash
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen hidden">
            <h1 class="logo small">LOBBY</h1>
            <div class="room-info">
                Room Code: <span id="lobby-room-code" class="highlight">----</span>
            </div>

            <div class="player-list-container">
                <h3>Players</h3>
                <ul id="player-list">
                    <!-- Players inserted here -->
                </ul>
            </div>

            <div class="lobby-actions">
                <button id="btn-ready" class="btn secondary">READY</button>
                <button id="btn-start-game" class="btn primary hidden">START GAME</button>
            </div>
        </div>

        <!-- Game UI (HUD) -->
        <div id="game-ui" class="screen hidden hud">
            <div class="hud-top">
                <div class="score-display">Score: <span id="hud-score">0</span></div>
                <div class="leaderboard-mini" id="hud-leaderboard">
                    <!-- Leaderboard injected here -->
                </div>
            </div>

            <!-- Mobile touch zones -->
            <div id="touch-left" class="touch-zone"></div>
            <div id="touch-right" class="touch-zone"></div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen hidden">
            <h1 class="logo medium">ROUND OVER</h1>

            <div class="results-container">
                <h2>LEADERBOARD</h2>
                <ul id="final-leaderboard">
                    <!-- Final results inserted here -->
                </ul>
            </div>

            <div class="results-actions">
                <button id="btn-return-lobby" class="btn primary">RETURN TO LOBBY</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
    <script src="multiplayer.js"></script>
</body>
</html>
